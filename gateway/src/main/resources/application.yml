server:
  port: 8086

spring:
  application:
    name: gateway
  config:
    import: "nacos:common.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
    gateway:
      # 服务发现路由配置：通过服务名转发
      routes:
        # 登录服务
        - id: login-server
          uri: lb://login-server
          predicates:
            - Path=/api/login/**
        # 主服务（gym）所有接口
        - id: main-server-admin
          uri: lb://main-server
          predicates:
            - Path=/api/admin/**
        - id: main-server-member
          uri: lb://main-server
          predicates:
            - Path=/api/member/**
        - id: main-server-employee
          uri: lb://main-server
          predicates:
            - Path=/api/employee/**
        - id: main-server-equipment
          uri: lb://main-server
          predicates:
            - Path=/api/equipment/**
        - id: main-server-class
          uri: lb://main-server
          predicates:
            - Path=/api/class/**
        - id: main-server-order
          uri: lb://main-server
          predicates:
            - Path=/api/order/**
        # 文件服务
        - id: file-server
          uri: lb://file-server
          predicates:
            - Path=/api/file/**,/pictures/**
        # 签到服务 (gym)
        - id: main-server-checkin
          uri: lb://main-server
          predicates:
            - Path=/api/checkin/**
        # 统计服务 (gym)
        - id: main-server-statistics
          uri: lb://main-server
          predicates:
            - Path=/api/statistics/**
        # AI 对话服务
        - id: ai-chat-server
          uri: lb://ai-chat-server
          predicates:
            - Path=/api/ai/**
        # 通知服务
        - id: notification-server
          uri: lb://notification-server
          predicates:
            - Path=/api/notification/**,/ws/**
        # 健身计划服务
        - id: plan-server
          uri: lb://plan-server
          predicates:
            - Path=/api/plan/**
      # 跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

    sentinel:
      transport:
        port: 8719

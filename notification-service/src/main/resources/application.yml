server:
  port: 8088

spring:
  application:
    name: notification-server
  config:
    import: "nacos:common.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.80.1:8848
      config:
        server-addr: 192.168.80.1:8848
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8722
      eager: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.springframework.web.socket: DEBUG
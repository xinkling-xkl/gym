server:
  port: 8088

spring:
  application:
    name: notification-server
  config:
    import: "nacos:common.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
    sentinel:
      transport:
        port: 8724

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123456}
  datasource:
    url: "jdbc:mysql://localhost:3307/gym?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# RocketMQ：notification-service 作为消费者，消费通知消息后落库 + WebSocket 推送
rocketmq:
  name-server: localhost:9876
  consumer:
    group: notify-consumer-group

mybatis:
  type-aliases-package: org.example.notification.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.web.socket: DEBUG
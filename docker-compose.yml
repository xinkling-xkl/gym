version: "3.8"

services:
  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0
    container_name: gym-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gym-net

  redis:
    image: redis:7.0-alpine
    container_name: gym-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gym-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: gym-nacos
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - gym-net

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: gym-sentinel
    restart: always
    environment:
      SERVER_PORT: 8858
    ports:
      - "8858:8858"
    networks:
      - gym-net

  # ==================== 业务服务 ====================
  gym:
    build: ./gym
    container_name: gym-main
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gym?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8084:8084"
    networks:
      - gym-net

  login:
    build: ./login
    container_name: gym-login
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gym?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8085:8085"
    networks:
      - gym-net

  file-service:
    build: ./file-service
    container_name: gym-file
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8087:8087"
    volumes:
      - ./picture:/app/picture
    networks:
      - gym-net

  ai-chat:
    build: ./ai-chat
    container_name: gym-aichat
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      NACOS_AUTH_USERNAME: ${NACOS_AUTH_USERNAME:-nacos}
      NACOS_AUTH_PASSWORD: ${NACOS_AUTH_PASSWORD:-nacos}
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8090:8090"
    networks:
      - gym-net

  notification-service:
    build: ./notification-service
    container_name: gym-notify
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8088:8088"
    networks:
      - gym-net

  gateway:
    build: ./gateway
    container_name: gym-gateway
    restart: always
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8086:8086"
    networks:
      - gym-net

  gymview:
    build: ./gymview
    container_name: gym-frontend
    restart: always
    depends_on:
      - gateway
    ports:
      - "80:80"
    networks:
      - gym-net

volumes:
  mysql-data:

networks:
  gym-net:
    driver: bridge

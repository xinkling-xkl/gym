server:
  port: 8090

spring:
  application:
    name: ai-chat-server
  config:
    import: "nacos:common.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.80.1:8848
      config:
        server-addr: 192.168.80.1:8848
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8723
      eager: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

# Python AI 服务地址
ai:
  python:
    url: http://localhost:8000

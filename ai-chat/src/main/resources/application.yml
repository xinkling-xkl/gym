server:
  port: 8090

spring:
  application:
    name: ai-chat-server
  config:
    import: "nacos:common.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      username: ${NACOS_AUTH_USERNAME:nacos}
      password: ${NACOS_AUTH_PASSWORD:nacos}
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
    sentinel:
      transport:
        port: 8723
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 3000ms
  # Spring AI：通过 OpenAI 兼容接口调用 DeepSeek
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-your-key-here}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 800

deepseek:
  # 旧配置保留兼容，实际由 spring.ai.openai 驱动
  api-key: ${DEEPSEEK_API_KEY:sk-your-key-here}
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat

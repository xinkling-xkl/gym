server:
  port: 8084

spring:
  application:
    name: main-server
  config:
    import: "nacos:common.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
    sentinel:
      transport:
        port: 8721
  datasource:
    url: "jdbc:mysql://localhost:3307/gym?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 默认配置（Redisson 读取；common.yaml 中的 spring.data.redis 会覆盖）
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0

# RocketMQ：gym 作为生产者，把通知消息异步投递到 broker
rocketmq:
  name-server: localhost:9876
  producer:
    group: notify-producer-group
    send-message-timeout: 3000

mybatis:
  type-aliases-package: com.gym.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Springdoc OpenAPI 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.gym.controller
